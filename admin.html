<!DOCTYPE html>
<html>
<head>
    <title>System Admin | Mandelli.dev</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-box { max-width: 600px; margin: 50px auto; padding: 20px; font-family: 'JetBrains Mono', monospace; }
        .pass-input { background: #111; border: 1px solid #333; color: #38bdf8; padding: 10px; width: 100%; margin-bottom: 20px; font-family: inherit; }
        .admin-item { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px; border-bottom: 1px solid #222; font-size: 0.8rem;
        }
        .del-btn { background: #ef4444; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; font-family: inherit; }
        .del-btn:hover { background: #b91c1c; }
    </style>
</head>
<body style="background: #050505; color: white;">
    <div class="admin-box">
        <h2>ADMIN_CONTROL_PANEL</h2>
        <input type="password" id="admin-password" class="pass-input" placeholder="ENTER_ADMIN_KEY...">
        <button id="sync-btn" class="btn" style="width:100%; margin-bottom: 20px;">SYNC_LOGS</button>
        
        <div id="admin-log-list"></div>
    </div>

    <script>
        const PROXY_URL = "https://api.mandelli.dev/";

        const syncBtn = document.getElementById('sync-btn');
        const listEl = document.getElementById('admin-log-list');
        const passInput = document.getElementById('admin-password');

        syncBtn.addEventListener('click', loadAdminLogs);

        async function loadAdminLogs() {
            listEl.textContent = "FETCHING_LOGS...";
            const adminKey = passInput.value.trim();

            try {
                // Pass key if Worker supports authenticated read path returning kv_key
                const headers = adminKey ? { 'x-admin-key': adminKey } : {};
                const res = await fetch(PROXY_URL + 'get-messages', { headers });
                
                if (!res.ok) throw new Error("HTTP_" + res.status);
                
                const messages = await res.json();
                listEl.textContent = '';

                if (!Array.isArray(messages) || messages.length === 0) {
                    listEl.textContent = "NO_ENTRIES_FOUND";
                    return;
                }

                messages.forEach(m => {
                    const item = document.createElement('div');
                    item.className = 'admin-item';

                    const textSpan = document.createElement('span');
                    const snippet = (m.message || '').substring(0, 20);
                    textSpan.textContent = `[${m.id}] ${snippet}...`;

                    const delBtn = document.createElement('button');
                    delBtn.className = 'del-btn';
                    delBtn.textContent = 'DELETE';

                    // Prefers kv_key (authenticated route) or falls back to message id (R-1 fix)
                    const targetKey = m.kv_key || m.id;
                    delBtn.addEventListener('click', () => deleteMsg(targetKey));

                    item.appendChild(textSpan);
                    item.appendChild(delBtn);
                    listEl.appendChild(item);
                });
            } catch (err) {
                listEl.textContent = "ERROR: " + err.message;
            }
        }

        async function deleteMsg(kvKey) {
            if (!confirm("Confirm permanent deletion of " + kvKey + "?")) return;
            
            const pass = passInput.value.trim();
            try {
                const res = await fetch(PROXY_URL + 'delete-message', {
                    method: 'DELETE',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-admin-key': pass 
                    },
                    body: JSON.stringify({ key: kvKey })
                });

                if (res.ok) {
                    alert("ENTRY_PURGED");
                    loadAdminLogs();
                } else {
                    alert("ACCESS_DENIED: INVALID_KEY");
                }
            } catch (err) {
                alert("NETWORK_ERROR: " + err.message);
            }
        }
    </script>
</body>
</html>
