<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandelli.dev | Guestbook</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* ... existing styles ... */
        .guestbook-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            margin-bottom: 30px;
            transition: color 0.2s;
        }

        .back-link:hover { color: #ffffff; }

        .log-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .log-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .log-entry {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            animation: slideIn 0.3s ease forwards;
        }

        .log-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: #38bdf8;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .log-text {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
            word-break: break-word;
        }

        /* Pagination Styles */
        .pagination-ctrls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }

        .pg-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }

        .pg-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            border-color: #38bdf8;
        }

        .pg-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loader {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.3);
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>
    <div class="guestbook-container">
        <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> RETURN_TO_HUB</a>
        
        <header class="log-header">
            <h1>GUESTBOOK<span class="dot">.</span>LOG</h1>
            <p class="tagline">// Public archive of system pings</p>
        </header>

        <div id="log-list" class="log-container">
            <div class="loader"><i class="fas fa-spinner fa-spin"></i> ACCESSING_ARCHIVE...</div>
        </div>

        <div id="pagination" class="pagination-ctrls"></div>
    </div>

    <script>
        const PROXY_URL = "https://api.mandelli.dev/";
        let allLogs = [];
        let currentPage = 1;
        const itemsPerPage = 5;

        async function loadLogs() {
            const listEl = document.getElementById('log-list');
            try {
                const res = await fetch(PROXY_URL + 'get-messages');
                allLogs = await res.json();

                if (allLogs.length === 0) {
                    listEl.textContent = '';
                    const emptyEl = document.createElement('div');
                    emptyEl.className = 'loader';
                    emptyEl.textContent = 'Archive is empty.';
                    listEl.appendChild(emptyEl);
                    return;
                }

                // Sort logs by date descending (newest first)
                allLogs.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                renderPage();
            } catch (e) {
                listEl.textContent = '';
                const errEl = document.createElement('div');
                errEl.className = 'loader';
                errEl.style.color = '#ef4444';
                errEl.textContent = 'ERROR: FAILED_TO_LOAD_ARCHIVE';
                listEl.appendChild(errEl);
            }
        }

        function renderPage() {
            const listEl = document.getElementById('log-list');
            const pgEl = document.getElementById('pagination');
            
            // Clear existing log nodes safely
            listEl.textContent = '';
            
            // Calculate slice
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = allLogs.slice(start, end);

            // XSS SAFE RENDER: Explicit DOM Node creation with .textContent assignment
            pageData.forEach(entry => {
                const entryCard = document.createElement('div');
                entryCard.className = 'log-entry';

                const metaDiv = document.createElement('div');
                metaDiv.className = 'log-meta';

                const idSpan = document.createElement('span');
                idSpan.textContent = `ENTRY_ID: ${entry.id ?? '----'}`;

                const dateSpan = document.createElement('span');
                const parsedDate = new Date(entry.date);
                dateSpan.textContent = isNaN(parsedDate) ? String(entry.date ?? '') : parsedDate.toLocaleString();

                metaDiv.appendChild(idSpan);
                metaDiv.appendChild(dateSpan);

                const textDiv = document.createElement('div');
                textDiv.className = 'log-text';
                textDiv.textContent = entry.message ?? ''; // Safely escapes raw HTML / JS payloads

                entryCard.appendChild(metaDiv);
                entryCard.appendChild(textDiv);

                listEl.appendChild(entryCard);
            });

            // Render Pagination Controls
            const totalPages = Math.ceil(allLogs.length / itemsPerPage);
            pgEl.textContent = ''; // Clear container

            if (totalPages > 1) {
                const prevBtn = document.createElement('button');
                prevBtn.className = 'pg-btn';
                prevBtn.disabled = currentPage === 1;
                prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i> PREV';
                prevBtn.addEventListener('click', () => changePage(-1));

                const pageIndicator = document.createElement('span');
                pageIndicator.style.color = 'rgba(255,255,255,0.5)';
                pageIndicator.textContent = `PAGE ${currentPage} / ${totalPages}`;

                const nextBtn = document.createElement('button');
                nextBtn.className = 'pg-btn';
                nextBtn.disabled = currentPage === totalPages;
                nextBtn.innerHTML = 'NEXT <i class="fas fa-chevron-right"></i>';
                nextBtn.addEventListener('click', () => changePage(1));

                pgEl.appendChild(prevBtn);
                pgEl.appendChild(pageIndicator);
                pgEl.appendChild(nextBtn);
            }
        }

        function changePage(step) {
            currentPage += step;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        loadLogs();
    </script>
</body>
</html>
