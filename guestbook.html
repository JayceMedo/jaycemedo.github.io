<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandelli.dev | Guestbook</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* ... existing styles ... */
        .guestbook-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            margin-bottom: 30px;
            transition: color 0.2s;
        }

        .back-link:hover { color: #ffffff; }

        .log-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .log-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .log-entry {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            animation: slideIn 0.3s ease forwards;
        }

        .log-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: #38bdf8;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .log-text {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
        }

        /* NEW: Pagination Styles */
        .pagination-ctrls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }

        .pg-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }

        .pg-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            border-color: #38bdf8;
        }

        .pg-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loader {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.3);
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>
    <div class="guestbook-container">
        <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> RETURN_TO_HUB</a>
        
        <header class="log-header">
            <h1>GUESTBOOK<span class="dot">.</span>LOG</h1>
            <p class="tagline">// Public archive of system pings</p>
        </header>

        <div id="log-list" class="log-container">
            <div class="loader"><i class="fas fa-spinner fa-spin"></i> ACCESSING_ARCHIVE...</div>
        </div>

        <div id="pagination" class="pagination-ctrls"></div>
    </div>

    <script>
        const PROXY_URL = "https://api.mandelli.dev/";
        let allLogs = [];
        let currentPage = 1;
        const itemsPerPage = 5;

        async function loadLogs() {
            const listEl = document.getElementById('log-list');
            try {
                const res = await fetch(PROXY_URL + 'get-messages');
                allLogs = await res.json();

                if (allLogs.length === 0) {
                    listEl.innerHTML = '<div class="loader">Archive is empty.</div>';
                    return;
                }

                // Sort logs by date descending (newest first)
                allLogs.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                renderPage();
            } catch (e) {
                listEl.innerHTML = '<div class="loader" style="color: #ef4444;">ERROR: FAILED_TO_LOAD_ARCHIVE</div>';
            }
        }

        function renderPage() {
            const listEl = document.getElementById('log-list');
            const pgEl = document.getElementById('pagination');
            
            // Calculate slice
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = allLogs.slice(start, end);

            // Render log entries
            listEl.innerHTML = pageData.map(entry => `
                <div class="log-entry">
                    <div class="log-meta">
                        <span>ENTRY_ID: ${entry.id}</span>
                        <span>${new Date(entry.date).toLocaleString()}</span>
                    </div>
                    <div class="log-text">${entry.message}</div>
                </div>
            `).join('');

            // Render Pagination Buttons
            const totalPages = Math.ceil(allLogs.length / itemsPerPage);
            if (totalPages > 1) {
                pgEl.innerHTML = `
                    <button class="pg-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(-1)">
                        <i class="fas fa-chevron-left"></i> PREV
                    </button>
                    <span style="color: rgba(255,255,255,0.5)">PAGE ${currentPage} / ${totalPages}</span>
                    <button class="pg-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(1)">
                        NEXT <i class="fas fa-chevron-right"></i>
                    </button>
                `;
            } else {
                pgEl.innerHTML = '';
            }
        }

        function changePage(step) {
            currentPage += step;
            renderPage();
            // Scroll back to top of logs
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        loadLogs();
    </script>
</body>
</html>
